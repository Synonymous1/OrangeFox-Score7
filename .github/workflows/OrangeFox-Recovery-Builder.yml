name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/Synonymous1/android_device_alps_tb8168p1'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/alps/tb8168p1_bsp'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'tb8168p1_bsp'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Building Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev

      - name: Sync Device Tree
        run: |
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b main workspace/${{ github.event.inputs.DEVICE_PATH }}

      - name: Build Recovery
        run: |
          cd workspace
          source build/envsetup.sh
          lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng || lunch fox_${{ github.event.inputs.DEVICE_NAME }}-eng
          mka recoveryimage
